[versions]
agp = "9.4.1"
# The Kotlin Gradle plugin also drives AGP's built-in Kotlin support, and the Compose compiler plugin version matches it.
kotlin = "2.4.20"
coroutines = "1.11.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
core = "1.19.1"
lifecycle = "2.11.0"
junit = "6.1.3"
# Patched versions of vulnerable dependencies of the build tools (AGP), which never ship in the APK.
bouncycastle = "1.86"
commons-lang3 = "3.21.0"
httpclient = "4.5.14"
jdom2 = "2.0.6.1"
jose4j = "0.9.7"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Build tools dependencies, see the root build.gradle.kts.
build-bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
build-bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
build-bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
build-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
build-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }
build-jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
build-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
