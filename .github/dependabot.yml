# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

registries:
  maven-google:
    type: maven-repository
    url: https://dl.google.com/dl/android/maven2/
  gradle-plugins:
    type: maven-repository
    url: https://plugins.gradle.org/m2/

updates:
  # Monthly, each ecosystem in a single pull request, to keep CI runs down. Security updates still come right away.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Supply chain: a new version is only proposed once it has been public for a week.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: gradle
    directory: /
    registries: "*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Also keeps the Kotlin, AndroidX and JUnit artifacts, released together, aligned.
      gradle:
        patterns: [ "*" ]
