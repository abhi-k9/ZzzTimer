name: Dependency graph

# Submits the resolved Gradle dependencies (transitive ones included) to GitHub, for Dependabot security alerts. New
# advisories are matched against the last submitted graph: it only needs to be submitted again when dependencies change.
on:
  push:
    branches: [ main ]
    paths:
      - "**.gradle.kts"
      - gradle.properties
      - gradle/**
      - .github/workflows/dependency-graph.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # submit the dependency graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
