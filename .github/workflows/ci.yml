name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Actions are pinned by commit SHA; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, test & lint
        run: ./gradlew assembleDebug assembleRelease :core:test lint --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
