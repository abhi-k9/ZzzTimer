name: CI

# Kept lean, Actions minutes are shared: work branches only get CI on demand (Actions → CI → Run workflow) or through a
# pull request, and changes that can't affect the build (docs, store listing, other workflows) don't trigger it.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - LICENSE
      - NOTICE
      - fastlane/**
      - .github/dependabot.yml
      - .github/workflows/dependency-graph.yml
      - .github/workflows/release.yml
      - .github/workflows/workflows.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - NOTICE
      - fastlane/**
      - .github/dependabot.yml
      - .github/workflows/dependency-graph.yml
      - .github/workflows/release.yml
      - .github/workflows/workflows.yml
  workflow_dispatch:

# Least privilege: jobs only read the repository, unless stated otherwise.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # A commit already verified by CI (e.g. on its branch, before main is fast-forwarded to it) isn't built again.
  verified:
    name: Already verified
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list the CI runs of this commit
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success" \
            --jq "[.workflow_runs[] | select(.name == \"$GITHUB_WORKFLOW\" and .id != $GITHUB_RUN_ID)] | length")
          echo "found=$([ "$runs" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test & lint
    needs: verified
    # Also runs when `verified` is skipped (not a push) or failed.
    if: ${{ !cancelled() && needs.verified.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_SHA256: 369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab

    steps:
      # Actions are pinned by commit SHA; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Kotlin style
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint.jar" "https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/$KTLINT_VERSION/ktlint-cli-$KTLINT_VERSION-all.jar"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint.jar" | sha256sum --check --strict
          java -jar "$RUNNER_TEMP/ktlint.jar" --relative "**/*.kt" "**/*.kts"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The MIT licensed cache implementation, instead of the default proprietary one.
          cache-provider: basic

      - name: Build, test & lint
        run: ./gradlew assembleDebug assembleRelease test lint --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
