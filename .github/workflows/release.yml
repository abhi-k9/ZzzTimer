name: Release

# Pushing a `vX.Y.Z` tag builds a signed release APK and publishes it as a GitHub Release.
# Requires the repository secrets described in the README ("Releasing").
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Releases never write to the cache shared with regular builds.
          cache-read-only: true

      - name: Check the tag matches the app version
        run: |
          version=$(./gradlew --quiet :app:printVersionName | tail -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version (app/build.gradle.kts)"
            exit 1
          fi

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZZZTIMER_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ZZZTIMER_SIGNING_KEYSTORE_BASE64 secret, see README (Releasing)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ZZZTIMER_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test & lint
        env:
          ZZZTIMER_SIGNING_STORE_PASSWORD: ${{ secrets.ZZZTIMER_SIGNING_STORE_PASSWORD }}
          ZZZTIMER_SIGNING_KEY_ALIAS: ${{ secrets.ZZZTIMER_SIGNING_KEY_ALIAS }}
          ZZZTIMER_SIGNING_KEY_PASSWORD: ${{ secrets.ZZZTIMER_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease :core:test lint --stacktrace

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was produced, check the signing secrets"
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/ZzzTimer-$GITHUB_REF_NAME.apk"
          (cd dist && sha256sum "ZzzTimer-$GITHUB_REF_NAME.apk" > "ZzzTimer-$GITHUB_REF_NAME.apk.sha256")

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ZzzTimer-${{ github.ref_name }}.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZzzTimer $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
