name: Workflows

# Audits the GitHub Actions workflows and the Dependabot configuration, when they change.
on:
  push:
    branches: [ main ]
    paths: [ .github/** ]
  pull_request:
    paths: [ .github/** ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Audits the GitHub Actions workflows and the Dependabot configuration.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

